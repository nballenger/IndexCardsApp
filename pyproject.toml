[project]
name = "indexcards"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Ballenger", email = "nballeng@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # pyside6-essentials, not the plain pyside6 umbrella package: the
    # umbrella unconditionally also pulls in pyside6-addons (WebEngine/
    # Chromium, Multimedia+FFmpeg, 3D, Charts, QML/Quick, Designer --
    # ~900MB), none of which this app uses. Only QtCore/QtGui/QtWidgets
    # are imported anywhere in src/ or tests/, and all three live in
    # Essentials, so this is a pure size cut, not a feature change.
    "pyside6-essentials>=6.11.2",
]

[project.scripts]
indexcards = "indexcards:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
